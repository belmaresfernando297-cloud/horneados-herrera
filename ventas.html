<!DOCTYPE html>
<html lang="es">

<head>

    <title>Ventas - Horneados Herrera</title>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>

<body>


    <header class="barra-superior">

        <div class="nombre-panaderia">
            Horneados Herrera
        </div>

        <nav class="navegacion">

            <a href="index.html">
                Inicio
            </a>

            <a href="inventario.html">
                Inventario
            </a>

            <a
                href="ventas.html"
                class="activo"
            >
                Ventas
            </a>

            <a href="historial.html">
                Historial
            </a>

        </nav>

    </header>


    <main class="contenedor-ventas">



        <section class="seccion-productos">

            <div class="tarjeta-seccion">

                <h1>
                    Productos disponibles
                </h1>


                <div class="buscador-ventas">

                    <label for="buscadorProductos">
                        Buscar producto
                    </label>

                    <input
                        type="text"
                        id="buscadorProductos"
                        placeholder="Escribe el nombre o categoría..."
                    >

                </div>

                <div id="listaProductos">

                </div>

            </div>

        </section>

        <section class="seccion-carrito">

            <div class="tarjeta-seccion">

                <h1>
                    Carrito
                </h1>


                <div id="carrito">

                </div>

                <div class="total-venta">

                    <span>
                        Total
                    </span>

                    <strong id="total">$0.00</strong>

                </div>

                <div class="pago-venta">

                    <label for="pagoCliente">
                        Pago del cliente
                    </label>

                    <input
                        type="number"
                        id="pagoCliente"
                        placeholder="Cantidad recibida"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="cambio-venta">

                    <span>
                        Cambio
                    </span>

                    <strong>
                        <span id="cambio">$0.00</span>
                    </strong>

                </div>


                <button
                    id="finalizarVenta"
                    class="boton-finalizar"
                >
                    Finalizar venta
                </button>

            </div>

        </section>

    </main>


 <section class="seccion-ticket">

    <div class="tarjeta-seccion">

        <h2>Ticket de venta</h2>

        <div id="ticket">

            <p class="ticket-vacio">
                El ticket aparecerá aquí después
                de finalizar la venta.
            </p>

        </div>

        <button
            id="imprimirTicket"
            class="boton-imprimir"
        >
            Imprimir ticket
        </button>

    </div>

</section>

    <script src="js/almacenamiento.js"></script>

    <script src="js/ventas.js"></script>


</body>

    <footer class="pie-pagina">
        <p>© Created by Juan Fernando Barrera Belmares.</p>
    </footer>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <title>Inventario - Horneados Herrera</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header class="barra-superior">

    <div class="nombre-panaderia">
        Horneados Herrera
    </div>

    <nav class="navegacion">

        <a href="index.html">
            Inicio
        </a>

        <a href="inventario.html" class="activo">
            Inventario
        </a>

        <a href="ventas.html">
            Ventas
        </a>

        <a href="historial.html">
            Historial
        </a>

    </nav>

</header>

<main class="contenedor-inventario">

    <section class="tarjeta-inventario">

        <h2>Agregar Producto</h2>

        <form id="formularioProducto">
        
            <div class="campo-inventario">

                <label for="nombre">
                    Nombre del producto:
                </label>

                <input 
                    type="text" 
                    id="nombre" 
                    required
                >

            </div>

            <div class="campo-inventario">

                <label for="categoria">
                    Categoría:
                </label>
                <select id="categoria" required>
                    <option value="">Selecciona una categoria</option>
                    <option value="Pan dulce">Pan dulce</option>
                    <option value="Pan blanco">Pan blanco</option>
                    <option value="Bocadillos">Bocadillos</option>
                    <option value="Pan de temporada">Pan de temporada</option>
                </select>
            
            </div>

            <div class="campo-inventario">

                <label for="precio">
                    Precio:
                </label>

                <input
                    type="number"
                    id="precio"
                    min="0"
                    step="0.01"
                    required
                >

            </div>

            <div class="campo-inventario">

                <label for="stock">
                    Stock:
                </label>

                <input
                    type="number"
                    id="stock"
                    min="0"
                    required
                >
            
            </div>

            <div class="campo-inventario">

                <label for="stockMinimo">
                    Stock mínimo:
                </label>

                <input
                    type="number"
                    id="stockMinimo"
                    min="0"
                    required
                >
            
            </div>

            <button type="submit">
                Agregar producto
            </button>

        </form>

    </section>

    <section class="tarjeta-inventario">

        <h2>Lista de Productos</h2>

        <label for="buscador">
            Buscar producto
        </label>

        <input 
            type="text"
            id="buscador"
            placeholder="Buscar en inventario..."    
        >

        <div class="tabla-inventario">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Stock mínimo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>

                </thead>
                
                    <tbody id="tablaProductos">

                    </tbody>

                </table>

        </div>

    </section>

</main>

<script src="js/almacenamiento.js"></script>
<script src="js/inventario.js?=6"></script>
